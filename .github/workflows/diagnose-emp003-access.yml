name: Diagnose EMP-003 Access identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare Access token identity without disclosing credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, sys
          keys = ['CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCESS_CLIENT_ID','CLOUDFLARE_ACCESS_CLIENT_SECRET']
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print('MISSING_SECRET_NAMES=' + ','.join(missing)); sys.exit(1)
          cid = os.environ['CLOUDFLARE_ACCESS_CLIENT_ID']
          secret = os.environ['CLOUDFLARE_ACCESS_CLIENT_SECRET']
          print('CLIENT_ID_TRIM_OK=' + str(cid == cid.strip()).lower())
          print('CLIENT_SECRET_TRIM_OK=' + str(secret == secret.strip()).lower())
          print('CLIENT_ID_SUFFIX_OK=' + str(cid.endswith('.access')).lower())
          print('CLIENT_SECRET_FORMAT=' + ('CFAST' if secret.startswith('cfast_') else 'LEGACY_OR_OTHER'))
          url = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/access/service_tokens?per_page=1000'
          req = urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as exc:
              print('CLOUDFLARE_LIST_HTTP=' + str(exc.code))
              print('CLOUDFLARE_API_PERMISSION_OR_REQUEST_FAILURE')
              sys.exit(1)
          if not data.get('success'):
              print('CLOUDFLARE_LIST_API_SUCCESS=false'); sys.exit(1)
          info = data.get('result_info') or {}
          if info.get('total_pages', 1) != 1:
              print('PAGINATION_INCOMPLETE'); sys.exit(1)
          matches = [t for t in data.get('result',[]) if t.get('client_id') == cid]
          print('MATCHING_CLIENT_ID_COUNT=' + str(len(matches)))
          if len(matches) != 1: sys.exit(1)
          target = matches[0]
          print('CLIENT_ID_MATCH=true')
          print('TARGET_TOKEN_ENABLED=' + str(target.get('enabled')).lower())
          if target.get('enabled') is not True: sys.exit(1)
          from datetime import datetime, timezone
          expiry = target.get('expires_at')
          if not isinstance(expiry, str) or not expiry:
              print('TOKEN_EXPIRY_UNKNOWN'); sys.exit(1)
          try:
              expiry_dt = datetime.fromisoformat(expiry.replace('Z', '+00:00'))
              valid = expiry_dt.tzinfo is not None and expiry_dt > datetime.now(timezone.utc)
          except ValueError:
              valid = False
          print('TOKEN_NOT_EXPIRED=' + str(valid).lower())
          if not valid: sys.exit(1)
          print('EMP003_ACCESS_IDENTITY_CHECK_PASS')
          PY
