name: Diagnose EMP-003 Access identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare Access token identity without disclosing credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMP003_ACCESS_AUDIT_API_TOKEN: ${{ secrets.EMP003_ACCESS_AUDIT_API_TOKEN }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, sys
          keys = ['CLOUDFLARE_ACCOUNT_ID','EMP003_ACCESS_AUDIT_API_TOKEN','CLOUDFLARE_ACCESS_CLIENT_ID','CLOUDFLARE_ACCESS_CLIENT_SECRET']
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print('MISSING_SECRET_NAMES=' + ','.join(missing)); sys.exit(1)
          cid = os.environ['CLOUDFLARE_ACCESS_CLIENT_ID']
          secret = os.environ['CLOUDFLARE_ACCESS_CLIENT_SECRET']
          print('CLIENT_ID_TRIM_OK=' + str(cid == cid.strip()).lower())
          print('CLIENT_SECRET_TRIM_OK=' + str(secret == secret.strip()).lower())
          print('CLIENT_ID_SUFFIX_OK=' + str(cid.endswith('.access')).lower())
          print('CLIENT_SECRET_FORMAT=' + ('CFAST' if secret.startswith('cfast_') else 'LEGACY_OR_OTHER'))
          base_url = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/access/service_tokens'
          matches = []
          page = 1
          while True:
              if page > 100:
                  print('PAGINATION_SAFETY_LIMIT'); sys.exit(1)
              url = base_url + '?per_page=100&page=' + str(page)
              req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['EMP003_ACCESS_AUDIT_API_TOKEN']})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as exc:
                  print('CLOUDFLARE_LIST_HTTP=' + str(exc.code))
                  print('CLOUDFLARE_API_PERMISSION_OR_REQUEST_FAILURE')
                  sys.exit(1)
              if not data.get('success'):
                  print('CLOUDFLARE_LIST_API_SUCCESS=false'); sys.exit(1)
              results = data.get('result')
              if not isinstance(results, list) or len(results) > 100:
                  print('TOKEN_LIST_INVALID'); sys.exit(1)
              info = data.get('result_info') or {}
              reported_page = info.get('page')
              if reported_page is not None and reported_page != page:
                  print('PAGINATION_PAGE_MISMATCH'); sys.exit(1)
              matches.extend(t for t in results if isinstance(t, dict) and t.get('client_id') == cid)
              total_pages = info.get('total_pages')
              if total_pages == 0 and page == 1 and len(results) == 0:
                  print('EMPTY_SERVICE_TOKEN_LIST=true')
                  break
              if total_pages is not None:
                  metadata_type = type(total_pages).__name__
                  metadata_value = total_pages if type(total_pages) is int and 0 <= total_pages <= 10000 else 'REDACTED_OR_INVALID'
                  print('PAGINATION_TOTAL_PAGES_TYPE=' + metadata_type)
                  print('PAGINATION_TOTAL_PAGES_SAFE_VALUE=' + str(metadata_value))
                  print('PAGINATION_REQUESTED_PAGE=' + str(page))
                  if type(total_pages) is not int or total_pages < page:
                      print('PAGINATION_METADATA_INVALID'); sys.exit(1)
                  if page == total_pages:
                      break
              elif len(results) < 100:
                  break
              page += 1
          print('PAGES_CHECKED=' + str(page))
          print('MATCHING_CLIENT_ID_COUNT=' + str(len(matches)))
          if len(matches) != 1: sys.exit(1)
          target = matches[0]
          print('CLIENT_ID_MATCH=true')
          print('TARGET_TOKEN_ENABLED=' + str(target.get('enabled')).lower())
          if target.get('enabled') is not True: sys.exit(1)
          from datetime import datetime, timezone
          expiry = target.get('expires_at')
          if not isinstance(expiry, str) or not expiry:
              print('TOKEN_EXPIRY_UNKNOWN'); sys.exit(1)
          try:
              expiry_dt = datetime.fromisoformat(expiry.replace('Z', '+00:00'))
              valid = expiry_dt.tzinfo is not None and expiry_dt > datetime.now(timezone.utc)
          except ValueError:
              valid = False
          print('TOKEN_NOT_EXPIRED=' + str(valid).lower())
          if not valid: sys.exit(1)
          print('EMP003_ACCESS_IDENTITY_CHECK_PASS')
          PY
