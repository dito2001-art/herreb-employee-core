name: Validate isolated two-Worker P0 harness
on:
  push:
    branches:
      - test/workforce-i32-two-worker-p0-20261031
    paths:
      - tests/workforce-i32-two-worker-p0.mjs
      - .github/workflows/validate-workforce-i32-two-worker-p0.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-worker-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Run isolated two-Worker JWT/DO harness
        run: node tests/workforce-i32-two-worker-p0.mjs
