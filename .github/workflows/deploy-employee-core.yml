name: Deploy Employee Core

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Approved exact commit SHA from main"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-employee-core
      cancel-in-progress: false
    steps:
      - name: Validate release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$RELEASE_SHA" != "$CURRENT_SHA" ]; then
            echo "::error::Release SHA must match exact currently approved main commit"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validation is intentionally read-only: deploy exactly the checked-out SHA.
      - name: Validate
        run: npm run check

      - name: Deploy Employee Core
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
