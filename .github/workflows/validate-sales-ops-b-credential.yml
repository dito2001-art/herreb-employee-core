name: Validate Sales Ops credential isolation

on:
  pull_request:
    branches:
      - fix/workforce-staging-no-r2-copy-20261031
      - review/workforce-final-bundle-20261102
    paths:
      - 'services/sales-ops/worker.js'
      - 'services/sales-ops/worker.test.mjs'
      - '.github/workflows/validate-sales-ops-b-credential.yml'

permissions:
  contents: read

concurrency:
  group: sales-ops-credential-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sales-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify checkout matches PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Sales Ops regression tests
        run: node --test services/sales-ops/worker.test.mjs
