name: Validate EMP-001 private runner (no deploy)
on:
  pull_request:
    branches:
      - fix/workforce-i32-minimal-integration-20261031
      - review/workforce-final-bundle-20261102
    paths:
      - 'deploy/staging/emp001-private-runner/**'
      - '.github/workflows/validate-emp001-private-runner.yml'
  push:
    branches:
      - fix/emp001-private-runner-p0-20261031
    paths:
      - 'deploy/staging/emp001-private-runner/**'
      - '.github/workflows/validate-emp001-private-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify private runner tests
        run: node --test deploy/staging/emp001-private-runner/private-runner.test.mjs
