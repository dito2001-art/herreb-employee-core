name: Format Employee Core Feature Branch

on:
  push:
    branches:
      - feature/employee-core-v0.1
    paths:
      - .github/workflows/format-feature.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/employee-core-v0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical formatting
        run: npx oxfmt --write .

      - name: Commit formatting only if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply canonical formatting"
          git push origin HEAD:feature/employee-core-v0.1
