name: Validate Workforce Platform Admin Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  platform-admin-security:
    name: Platform admin authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify platform credential and internal actor authorization
        run: npx --yes tsx@4.23.13 --test src/runtime/workforce-platform-admin-auth.test.ts src/runtime/workforce-admin-auth.test.ts src/runtime/workforce-admin-scoped-read.test.ts src/runtime/workforce-admin-read-projection.test.ts src/runtime/workforce-admin-access-principal.test.ts src/runtime/workforce-admin-access-jwt.test.ts src/runtime/workforce-admin-access-read.test.ts src/runtime/workforce-admin-write.test.ts
