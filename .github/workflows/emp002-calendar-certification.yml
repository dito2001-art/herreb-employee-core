name: EMP-002 Calendar Production Certification

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_EMP002_CALENDAR_CERT to authorize one temporary CRM agenda certification'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: emp002-calendar-production-certification
  cancel-in-progress: false

jobs:
  certify:
    if: ${{ inputs.confirm == 'RUN_EMP002_CALENDAR_CERT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:core
      - name: Run guarded CRM agenda certification
        env:
          CERT_TOKEN: ${{ secrets.WORKFORCE_ADMIN_M2M_TOKEN }}
          CERT_URL: https://herreb-employee-core.dito2001.workers.dev/api/internal/emp002/calendar-certification
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          STARTS_AT="$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%S.000Z)"
          ENDS_AT="$(date -u -d '+14 days +30 minutes' +%Y-%m-%dT%H:%M:%S.000Z)"
          KEY="emp002-calendar-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BODY="$(printf '{"tenantId":"herreb-client-0","correlationId":"%s","idempotencyKey":"%s","startsAt":"%s","endsAt":"%s","now":"%s"}' "$KEY" "$KEY" "$STARTS_AT" "$ENDS_AT" "$NOW")"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' -X POST "$CERT_URL" -H 'content-type: application/json' -H "x-herreb-workforce-admin-token: $CERT_TOKEN" --data "$BODY")"
          RESPONSE="$(cat "$RESPONSE_FILE")"
          echo "HTTP status: $STATUS"
          printf '%s\n' "$RESPONSE"
          test "$STATUS" = "200"
          node -e 'const r=JSON.parse(process.argv[1]); if(!r.ok||!r.verified||!r.persistenceConfirmed||r.externalCalendarRequired!==false||!r.cleanupOk) process.exit(1); console.log("CERTIFIED CRM agenda record="+r.id)' "$RESPONSE"
