name: Forensic Wrangler Bundle

on:
  push:
    paths:
      - '.github/workflows/forensic-wrangler-bundle.yml'
  pull_request:
    paths:
      - '.github/workflows/forensic-wrangler-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production formatter step
        run: npx oxfmt --write .

      - name: Validate exactly as deploy workflow
        run: npm run check

      - name: Build Wrangler bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler-forensics

      - name: Inspect Workforce Admin resolver occurrences
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Wrangler forensic output ==="
          find .wrangler-forensics -maxdepth 2 -type f -print

          python <<'PY'
          from pathlib import Path

          root = Path('.wrangler-forensics')
          marker = 'WORKFORCE_ADMIN_IDENTITY_NOT_FOUND'
          fast_markers = [
              'x-herreb-internal-actor-id',
              'internalActorId',
              'internalTenantId',
              'internalRole',
          ]

          total = 0
          associated = 0
          files_with_marker = 0

          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              try:
                  text = path.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue

              positions = []
              start = 0
              while True:
                  pos = text.find(marker, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  start = pos + len(marker)

              if not positions:
                  continue

              files_with_marker += 1
              print(f'FILE={path} OCCURRENCES={len(positions)}')
              for i, pos in enumerate(positions, 1):
                  total += 1
                  lo = max(0, pos - 2500)
                  hi = min(len(text), pos + len(marker) + 2500)
                  context = text[lo:hi]
                  present = [m for m in fast_markers if m in context]
                  if present:
                      associated += 1
                  print(f'--- OCCURRENCE {total} ({path} local #{i}) ---')
                  print('FAST_PATH_MARKERS_NEARBY=' + (','.join(present) if present else 'NONE'))
                  print(context.replace('\x00', ''))
                  print(f'--- END OCCURRENCE {total} ---')

          print(f'FORENSIC_IDENTITY_ERROR_OCCURRENCES={total}')
          print(f'FORENSIC_FILES_WITH_IDENTITY_ERROR={files_with_marker}')
          print(f'FORENSIC_OCCURRENCES_WITH_FAST_PATH_CONTEXT={associated}')

          if total == 0:
              raise SystemExit('No WORKFORCE_ADMIN_IDENTITY_NOT_FOUND occurrence found in Wrangler bundle')
          if associated != total:
              raise SystemExit(f'At least one identity-error occurrence lacks nearby fast-path markers: {associated}/{total}')
          PY

      - name: Upload forensic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-bundle-forensics
          path: .wrangler-forensics/
          if-no-files-found: error
          retention-days: 7
