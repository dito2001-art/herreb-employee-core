name: EMP002 Staging Preflight Static
on:
  pull_request:
    paths:
      - 'staging/emp002-entry.ts'
      - 'staging/emp002.wrangler.preflight.jsonc'
      - 'tests/emp002-staging-preflight.test.mjs'
      - 'tests/emp002-staging-behavior.mjs'
      - '.github/workflows/emp002-staging-preflight.yml'
  workflow_dispatch:
jobs:
  static-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: New staging static tests only
        run: node --test tests/emp002-staging-preflight.test.mjs
      - name: Isolated staging behavior (new scenarios only)
        run: |
          npm install --no-save --ignore-scripts miniflare@4 esbuild@0.28
          node tests/emp002-staging-behavior.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
