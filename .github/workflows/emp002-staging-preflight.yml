name: EMP002 Staging Preflight Static
on:
  pull_request:
    paths:
      - 'staging/emp002-entry.ts'
      - 'staging/emp002.wrangler.preflight.jsonc'
      - 'tests/emp002-staging-preflight.test.mjs'
      - 'tests/emp002-staging-behavior.mjs'
      - '.github/workflows/emp002-staging-preflight.yml'
  workflow_dispatch:
jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: New staging static tests only
        run: node --test tests/emp002-staging-preflight.test.mjs
      - name: Isolated staging behavior (new scenarios only)
        run: |
          npm install --no-save --ignore-scripts miniflare@4 esbuild@0.28
          node -e "for (const p of ['miniflare','esbuild','typescript']) console.log(p,require(p+'/package.json').version)"
          node tests/emp002-staging-behavior.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
