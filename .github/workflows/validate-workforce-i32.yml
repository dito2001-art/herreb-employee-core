name: Validate Workforce I3.2 integration
on:
  pull_request:
    branches: [feat/workforce-i31-access-gateway]
    paths:
      - 'src/runtime/emp002-operations.ts'
      - 'src/runtime/emp002-native-reminder-store.ts'
      - 'src/runtime/emp002-native-reminder-store.test.ts'
      - 'services/sales-ops/worker.js'
      - '.github/workflows/validate-workforce-i32.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Native reminder regression
        run: node --import tsx --test src/runtime/emp002-native-reminder-store.test.ts
      - name: Sales Ops authority regression
        run: node --test services/sales-ops/worker.test.mjs
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Lint changed runtime files
        run: npx --no-install oxlint src/runtime/emp002-operations.ts src/runtime/emp002-native-reminder-store.ts src/runtime/emp002-native-reminder-store.test.ts
      - name: Portal build
        run: npm run build:console
