name: Validate Workforce I1
on:
  pull_request:
    branches: [plan/workforce-integrated-master-20261030]
    paths:
      - 'src/**'
      - '.github/workflows/validate-workforce-i1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Affected ingress, shell and lifecycle tests
        run: node --import tsx --test src/workforce-i1-ingress.test.ts src/workforce-shell.test.ts src/runtime/emp003-copy-lifecycle.test.ts src/emp003-copy-governance.test.ts src/emp003-copy-library.test.ts
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Affected lint
        run: npx --no-install oxlint src/worker.ts src/staging/workforce-integrated-entry.ts src/staging/workforce-integrated-entry.test.ts src/workforce-i1-ingress.test.ts src/workforce-shell.tsx src/workforce-shell.test.ts src/workforce-root.tsx
      - name: Portal build
        run: npm run build:console
