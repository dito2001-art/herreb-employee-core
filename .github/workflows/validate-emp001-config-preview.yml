name: EMP001 configuration preview
on:
  pull_request:
    paths:
      - 'src/emp001-configuration*'
      - 'src/emp001-closing-settings.tsx'
      - 'scripts/test-emp001-closing-preview.mjs'
      - 'src/emp001-ai-chat.tsx'
      - 'src/emp001-knowledge-library.tsx'
      - 'src/staging/emp001-document-parsers.js'
      - 'tools/document-parsers/package*.json'
      - 'examples/emp001-ejemplo.csv'
      - 'scripts/test-emp001-documents.mjs'
      - 'scripts/test-emp001-ai-preview.mjs'
      - 'scripts/test-emp001-ai-keyboard-preview.mjs'
      - 'src/staging/emp001-config-preview.tsx'
      - 'src/staging/emp001-assistant*'
      - 'scripts/*emp001-preview.mjs'
      - '.github/workflows/validate-emp001-config-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tools/document-parsers --ignore-scripts
      - run: node scripts/build-emp001-preview.mjs
      - run: node scripts/test-emp001-preview.mjs
      - run: node scripts/test-emp001-closing-preview.mjs
      - run: node scripts/test-emp001-documents.mjs
      - run: node scripts/test-emp001-ai-preview.mjs
      - run: node scripts/test-emp001-ai-keyboard-preview.mjs
      - run: npx --no-install tsc --ignoreConfig --noEmit --strict --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --skipLibCheck env.d.ts src/staging/emp001-assistant-window.tsx src/staging/emp001-config-preview.tsx src/emp001-configuration.tsx
