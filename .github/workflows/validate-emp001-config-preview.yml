name: EMP001 configuration preview
on:
  pull_request:
    paths:
      - 'src/emp001-configuration*'
      - 'src/emp001-ai-chat.tsx'
      - 'scripts/test-emp001-ai-preview.mjs'
      - 'src/staging/emp001-config-preview.tsx'
      - 'scripts/*emp001-preview.mjs'
      - '.github/workflows/validate-emp001-config-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-emp001-preview.mjs
      - run: node scripts/test-emp001-preview.mjs
      - run: node scripts/test-emp001-ai-preview.mjs
      - run: npx --no-install tsc --ignoreConfig --noEmit --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --skipLibCheck src/staging/emp001-config-preview.tsx src/emp001-configuration.tsx
