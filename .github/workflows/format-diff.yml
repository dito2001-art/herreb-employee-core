name: EMP002 Format Diff

on:
  push:
    branches:
      - feature/preflight-hardening-v0.1

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Render formatter diff
        run: |
          npx oxfmt --write package.json src/adapters/read-only-http.ts src/core/sqlite-audit.test.ts src/runtime/emp002-client0-e2e.test.ts
          git diff -- package.json src/adapters/read-only-http.ts src/core/sqlite-audit.test.ts src/runtime/emp002-client0-e2e.test.ts
