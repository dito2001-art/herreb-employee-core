name: Validate Workforce Client0 Functional
on:
  pull_request:
    branches: [fix/emp003-copy-readback-selection-20261029]
    paths:
      - 'src/emp002-calendar-*'
      - 'src/core/workforce-calendar-time*'
      - 'src/runtime/emp002-operations.ts'
      - 'src/runtime/emp002-native-whatsapp.test.ts'
      - 'src/workforce-shell*'
      - 'services/sales-ops/**'
      - '.github/workflows/validate-workforce-client0-functional.yml'
permissions:
  contents: read
concurrency:
  group: workforce-client0-functional-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      TZ: 'UTC'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Affected integration checks
        run: |
          node --test services/sales-ops/worker.test.mjs
          node --import tsx --test src/core/workforce-calendar-time.test.ts src/runtime/emp002-native-whatsapp.test.ts src/emp002-calendar-dashboard.test.ts src/workforce-shell.test.ts src/runtime/emp002-browser-calendar.test.ts src/runtime/workforce-calendar-store.test.ts src/adapters/sales-ops-contract.test.ts src/runtime/emp001-browser-sales.test.ts src/emp003-copy-library.test.ts src/emp003-copy-governance.test.ts src/runtime/emp003-copy-lifecycle.test.ts src/emp003-workspace.test.ts
      - name: Types
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Affected lint
        run: node node_modules/oxlint/bin/oxlint src/core/workforce-calendar-time.ts src/core/workforce-calendar-time.test.ts src/runtime/emp002-operations.ts src/runtime/emp002-native-whatsapp.test.ts src/emp002-calendar-dashboard.tsx src/emp002-calendar-dashboard.test.ts src/workforce-shell.tsx src/workforce-shell.test.ts services/sales-ops/worker.js services/sales-ops/worker.test.mjs
      - name: Build only
        run: npm run build:console
