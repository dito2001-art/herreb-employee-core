name: Diagnose Workforce Admin Formatter
on:
  push:
    branches:
      - diagnostics/admin-oxfmt-idempotence-20261014
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture exact formatter output
        run: |
          npx oxfmt --write .
          echo '=== FORMATTED DIFF ==='
          git diff -- src/runtime/workforce-admin-access-read.ts
          echo '=== SECOND PASS ==='
          npx oxfmt --check .
