name: EMP-002 Controlled E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_EMP002_E2E to authorize one real WhatsApp test'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: emp002-controlled-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ inputs.confirm == 'RUN_EMP002_E2E' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Core tests
        run: npm run test:core

      - name: Run guarded EMP-002 production E2E
        shell: bash
        env:
          E2E_TOKEN: ${{ secrets.WORKFORCE_ADMIN_M2M_TOKEN }}
          E2E_URL: https://herreb-employee-core.dito2001.workers.dev/api/internal/emp002/e2e
          E2E_TENANT: herreb-client-0
          E2E_WHATSAPP: '595981538641'
        run: |
          set -euo pipefail

          test "$E2E_TENANT" = 'herreb-client-0'
          test "$E2E_WHATSAPP" = '595981538641'
          test -n "$E2E_TOKEN"

          APPT_ID="emp002-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          STARTS_AT="$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%S.000Z)"

          BODY="$(printf '{"tenantId":"%s","whatsapp":"%s","appointmentId":"%s","now":"%s","startsAt":"%s"}' \
            "$E2E_TENANT" \
            "$E2E_WHATSAPP" \
            "$APPT_ID" \
            "$NOW" \
            "$STARTS_AT")"

          RESPONSE="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X POST "$E2E_URL" \
            -H 'content-type: application/json' \
            -H "x-herreb-workforce-admin-token: $E2E_TOKEN" \
            --data "$BODY")"

          echo "$RESPONSE"

          node -e '
            const r = JSON.parse(process.argv[1]);

            if (
              !r.ok ||
              !r.providerMessageId ||
              r.secondExecution?.prepared !== 0 ||
              r.secondExecution?.executed !== 0
            ) {
              console.error("EMP-002 E2E certification failed");
              process.exit(1);
            }

            console.log(`CERTIFIED wamid=${r.providerMessageId}`);
          ' "$RESPONSE"
