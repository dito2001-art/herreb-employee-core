name: EMP-002 Controlled E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_EMP002_E2E to authorize one real WhatsApp test'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: emp002-controlled-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ inputs.confirm == 'RUN_EMP002_E2E' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate exact revision
        run: npm run check

      - name: Run guarded EMP-002 E2E through Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          E2E_TENANT: herreb-client-0
          E2E_WHATSAPP: '595981538641'
        run: |
          set -euo pipefail
          test "$E2E_TENANT" = 'herreb-client-0'
          test "$E2E_WHATSAPP" = '595981538641'
          APPT_ID="emp002-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          STARTS_AT="$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%S.000Z)"
          npx wrangler dev --remote --test-scheduled --port 8787 > /tmp/emp002-e2e-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill $WRANGLER_PID 2>/dev/null || true; cat /tmp/emp002-e2e-wrangler.log || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "E2E harness requires a private invocation route; refusing to expose Durable Object endpoints publicly."
          echo "tenant=$E2E_TENANT appointment=$APPT_ID now=$NOW startsAt=$STARTS_AT"
          exit 2
