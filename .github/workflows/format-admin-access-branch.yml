name: Format Admin Access Branch
on:
  push:
    branches:
      - fix/admin-access-oxfmt-configuration-20261014
    paths:
      - .github/workflows/format-admin-access-branch.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format exact source and verify
        run: |
          npx oxfmt --write src/runtime/workforce-admin-access-read.ts
          git diff --stat -- src/runtime/workforce-admin-access-read.ts
      - name: Commit formatted file only
        run: |
          if ! git diff --quiet -- src/runtime/workforce-admin-access-read.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/runtime/workforce-admin-access-read.ts
            git commit -m "style: apply repository oxfmt to admin access read"
            git push origin HEAD:fix/admin-access-oxfmt-configuration-20261014
          fi
