name: Deploy Employee Core

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-herreb-employee-core
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npx oxfmt --check .
          npm run lint
          npx tsc --noEmit
          npm run test:core

      - name: Build console
        run: npm run build:console

      - name: Deploy Worker
        run: npx wrangler deploy --strict
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
