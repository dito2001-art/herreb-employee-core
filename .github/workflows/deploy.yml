name: Deploy Employee Core

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Approved exact main SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-employee-core
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Verify exact approved release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$RELEASE_SHA" = "$EXPECTED_SHA" ] || exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting gate
        run: |
          npx oxfmt --write src/adapters/controlled-write-http.ts src/adapters/controlled-write-http.test.ts
          git diff -- src/adapters/controlled-write-http.ts src/adapters/controlled-write-http.test.ts
          git diff --quiet -- src/adapters/controlled-write-http.ts src/adapters/controlled-write-http.test.ts

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Core tests
        run: npm run test:core

      - name: Build console
        run: npm run build:console

      - name: Deploy Worker
        run: npx wrangler deploy --strict
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
