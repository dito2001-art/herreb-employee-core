name: Validate Employee Core

on:
  push:
    branches:
      - main
      - feature/employee-core-v0.1
      - feature/employee-runtime-v0.1
  pull_request:
    branches:
      - main
      - feature/employee-core-v0.1

permissions:
  contents: read

concurrency:
  group: employee-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        id: formatting
        continue-on-error: true
        run: |
          npx oxfmt --write .
          git diff -- src/runtime/emp002-autonomous-scheduling.test.ts src/runtime/emp002-autonomous-scheduling.ts src/runtime/emp002-cognitive-scheduling.test.ts src/runtime/emp002-cognitive-scheduling.ts src/runtime/emp002-scheduling.test.ts src/runtime/emp002-scheduling.ts src/runtime/emp002-slot-recovery.test.ts src/runtime/emp002-slot-recovery.ts
          git diff --quiet

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Core tests
        id: tests
        continue-on-error: true
        run: npm run test:core

      - name: Validation result
        if: always()
        env:
          FORMATTING: ${{ steps.formatting.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "Formatting: $FORMATTING"
          echo "Lint:       $LINT"
          echo "TypeScript: $TYPESCRIPT"
          echo "Tests:      $TESTS"
          if [ "$FORMATTING" != "success" ] || [ "$LINT" != "success" ] || [ "$TYPESCRIPT" != "success" ] || [ "$TESTS" != "success" ]; then
            exit 1
          fi
