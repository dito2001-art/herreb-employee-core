name: Validate Employee Core

on:
  push:
    branches:
      - main
      - feature/employee-core-v0.1
      - feature/employee-runtime-v0.1
  pull_request:
    branches:
      - main
      - feature/employee-core-v0.1
      - feat/workforce-admin-foundation

permissions:
  contents: read

concurrency:
  group: employee-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Employee Core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        id: formatting
        continue-on-error: true
        run: |
          npx oxfmt --write src/adapters/controlled-write-http.ts src/adapters/controlled-write-http.test.ts
          git diff -- src/adapters/controlled-write-http.ts src/adapters/controlled-write-http.test.ts
          git diff --quiet -- src/adapters/controlled-write-http.ts src/adapters/controlled-write-http.test.ts

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: npx tsc --noEmit

      - name: EMP-003 M2M fail-closed revision negative tests
        run: npx tsx --test src/runtime/emp003-m2m-draft-revision.test.ts src/runtime/emp003-cas-contract.test.ts

      - name: EMP-003 real Worker and Durable Object negative integration (local workerd only)
        run: |
          npx wrangler dev --local --config tests/workerd/wrangler.toml --port 8791 > /tmp/wf00-workerd.log 2>&1 &
          WORKERD_PID=$!
          trap 'kill "$WORKERD_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl --silent --max-time 1 http://127.0.0.1:8791/fixture/health >/dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then cat /tmp/wf00-workerd.log; exit 1; fi
          npx tsx tests/workerd/emp003-local-e2e.ts || { cat /tmp/wf00-workerd.log; exit 1; }
      - name: EMP-003 browser campaign API regression
        run: npx tsx --test src/runtime/emp003-browser-campaign.test.ts src/runtime/emp003-browser-draft-write.test.ts src/runtime/emp003-browser-operations.test.ts
      - name: Native Workforce calendar API regression
        run: npx --yes tsx@4.23.13 --test src/runtime/emp002-browser-calendar.test.ts src/runtime/workforce-calendar-store.test.ts src/runtime/emp002-calendar-production-certification.test.ts
      - name: Sales Ops authority and adapter contract regression
        run: |
          node --test services/sales-ops/worker.test.mjs
          npx --yes tsx@4.23.13 --test src/adapters/sales-ops-contract.test.ts
      - name: Build Workforce portal
        run: npm run build:console
      - name: Core tests
        id: tests
        continue-on-error: true
        run: npm run test:core

      - name: Validation result
        if: always()
        env:
          FORMATTING: ${{ steps.formatting.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "Formatting: $FORMATTING"
          echo "Lint:       $LINT"
          echo "TypeScript: $TYPESCRIPT"
          echo "Tests:      $TESTS"
          if [ "$FORMATTING" != "success" ] || [ "$LINT" != "success" ] || [ "$TYPESCRIPT" != "success" ] || [ "$TESTS" != "success" ]; then
            exit 1
          fi
