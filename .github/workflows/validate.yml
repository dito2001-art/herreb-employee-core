name: Validate Employee Core

on:
  push:
    branches:
      - main
      - feature/employee-core-v0.1
      - feature/employee-runtime-v0.1
  pull_request:
    branches:
      - main
      - feature/employee-core-v0.1

permissions:
  contents: read

concurrency:
  group: employee-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npx oxfmt --check .

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Core tests
        run: npm run test:core
