name: Validate Employee Core

on:
  push:
    branches:
      - main
      - feature/employee-core-v0.1
      - feature/employee-runtime-v0.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: employee-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        id: formatting
        continue-on-error: true
        run: npx oxfmt --check .

      - name: Lint
        id: lint
        continue-on-error: true
        run: npx oxlint src/

      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: npx tsc

      - name: Core tests
        id: tests
        continue-on-error: true
        run: npm run test:core

      - name: Validation gate
        if: always()
        run: |
          test "${{ steps.formatting.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.typescript.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
