name: Validate Employee Core

on:
  push:
    branches:
      - main
      - feature/employee-core-v0.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: employee-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and lint
        run: npm run check

      - name: Core tests
        run: npm run test:core
