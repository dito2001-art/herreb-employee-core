name: Validate staging B simulated payment
on:
  pull_request:
    paths: ['services/sales-ops/staging-b-simulated-payment.mjs', 'services/sales-ops/simulated-payment*.mjs', 'services/sales-ops/wrangler.simulated-payment-stg-b.jsonc', '.github/workflows/validate-staging-b-simulated-payment.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test services/sales-ops/simulated-payment.test.mjs
